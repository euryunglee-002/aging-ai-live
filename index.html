<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Aging AI</title>
<script>
  if (innerWidth < 900 || innerHeight > innerWidth * 1.05) location.replace("page.html" + location.search);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400&family=Tinos&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1f1ee; --ink:#151617; --ink2:#4a4c4f; --mid:#6c6e71; --muted:#9a9c9f; --rule:#c6c7c9; --faint:rgba(20,22,24,.08);
    --ring:#b4b7ba; --cuso4:#318ecc; --deep:#1f2fb8; --cum:#13263a; --cum-fill:rgba(19,38,58,.26); --neg:#9a9c9f; --replay:rgba(49,142,204,.13);
    --serif:"Times New Roman",Tinos,Times,serif;
    --sans:Helvetica,"Helvetica Neue",Arimo,Arial,sans-serif;
    --mono:Menlo,Consolas,"DejaVu Sans Mono",monospace;
  }
  body.dark{
    --bg:#0e0e0f; --ink:#e4e5e6; --ink2:#b3b5b8; --mid:#86888c; --muted:#5d5f63; --rule:#2c2d30; --faint:rgba(255,255,255,.07);
    --ring:#3d3f43; --cuso4:#4aa8ea; --deep:#8c98ff; --cum:#d9dbdd; --cum-fill:rgba(217,219,221,.22); --neg:#6b6d71; --replay:rgba(74,168,234,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:#000;color:var(--ink);font:16px/1.4 var(--sans);-webkit-font-smoothing:antialiased;cursor:none}
  svg text{font-family:var(--mono)}
  #stage{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--bg)}
  .mono{font-family:var(--mono)}

  .top{position:absolute;left:56px;right:56px;top:34px;height:36px;display:flex;justify-content:space-between;align-items:baseline;
       font:15px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);border-bottom:1px solid var(--rule)}
  .top b{font-weight:400;color:var(--ink)}
  .top .r{display:flex;gap:34px}
  #state.live{color:var(--deep)}
  #state.live::before{content:"";display:inline-block;width:8px;height:8px;background:var(--cuso4);margin-right:10px;vertical-align:1px;animation:beat 2s steps(2,end) infinite}
  @keyframes beat{50%{opacity:0}}

  #cells{position:absolute;left:56px;top:100px}
  .legend{position:absolute;left:56px;top:900px;width:820px;font:14px/1.8 var(--mono);color:var(--mid)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:8px}
  .legend span{margin-right:30px}

  .nums{position:absolute;left:960px;right:56px;top:106px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
  .num{font:400 58px/1 var(--serif);letter-spacing:-.01em}
  .num small{font:15px var(--mono);color:var(--ink2);margin-left:8px;letter-spacing:0}
  .num.deep{color:var(--deep)}
  .lab{font:14px/1.5 var(--mono);color:var(--mid);margin-top:8px}

  #term{position:absolute;left:960px;right:56px;top:232px;height:560px;overflow:hidden;font:14.5px/21px var(--mono);color:var(--ink2);
        border-top:1px solid var(--rule);padding-top:12px;white-space:pre}
  #term div{height:21px;overflow:hidden;text-overflow:ellipsis}
  #term .h{color:var(--ink)}
  #term .p{color:var(--deep)}
  #term .on{color:var(--cuso4)}
  #term .dim{color:var(--muted)}
  #term .cur::after{content:"▍";color:var(--cuso4);animation:beat 1s steps(2,end) infinite}

  .panel-lab{position:absolute;left:960px;right:56px;top:812px;font:14px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);
             border-top:1px solid var(--rule);padding-top:12px;display:flex;justify-content:space-between}
  .panel-lab span:last-child{letter-spacing:0;text-transform:none;color:var(--mid)}
  .panel{position:absolute;left:960px;top:850px;opacity:0;transition:opacity .8s}
  .panel.show{opacity:1}
  .rip{transform-box:fill-box;transform-origin:center}
</style>
</head>
<body>
<div id="stage">
  <div class="top">
    <span><b>Aging AI</b> &nbsp; NEMA / Boston</span>
    <span class="r"><span id="state">—</span><span id="clock"></span></span>
  </div>

  <svg id="cells" width="820" height="780" aria-label="25 cells"></svg>
  <div class="legend">
    <div><span><i style="background:var(--cuso4)"></i>pulse, this hour</span><span><i id="cumKey"></i>current, total</span><span>× dead</span></div>
    <div id="copper"></div>
    <div>ISO New England · NEMA 4008 &nbsp;/&nbsp; Open-Meteo · Boston &nbsp;/&nbsp; weights fixed 2026-09-22</div>
  </div>

  <div class="nums">
    <div><div class="num" id="obs">—</div><div class="lab" id="obsT">demand</div></div>
    <div><div class="num" id="act">—</div><div class="lab" id="actT">neurons</div></div>
    <div><div class="num deep" id="fc">—</div><div class="lab" id="fcT">forecast</div></div>
  </div>

  <div id="term"></div>

  <div class="panel-lab"><span id="panelTitle"></span><span id="panelNote"></span></div>
  <svg class="panel" id="net" width="904" height="200" data-title="inputs → neurons → forecast"></svg>
  <svg class="panel" id="rec" width="904" height="200" data-title="since 2026-09-22"></svg>
</div>

<script>
const N = 25, TZ = "America/New_York", HOUR = 3.6e6, DAY = 864e5, FULL_MS = 100000;
if (new URLSearchParams(location.search).get("theme") === "dark") document.body.classList.add("dark");
const css = n => getComputedStyle(document.body).getPropertyValue(n).trim();
const C = {ink: css("--ink"), ink2: css("--ink2"), mid: css("--mid"), muted: css("--muted"), ring: css("--ring"), faint: css("--faint"),
           cuso4: css("--cuso4"), deep: css("--deep"), cum: css("--cum"), cumFill: css("--cum-fill"), neg: css("--neg"), replay: css("--replay"), rule: css("--rule")};
const $ = id => document.getElementById(id);
const fmtMW = v => v == null ? "—" : Math.round(v).toLocaleString("en-US");
const bost = (iso, opt) => iso ? new Intl.DateTimeFormat("en-US", Object.assign({timeZone: TZ}, opt)).format(new Date(iso)) : "";
const hhmm = iso => bost(iso, {hour: "2-digit", minute: "2-digit", hourCycle: "h23"});
const ymdB = iso => new Intl.DateTimeFormat("en-CA", {timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit"}).format(new Date(iso));
const plusH = (iso, h) => new Date(new Date(iso).getTime() + h * HOUR).toISOString();
const nn = i => String(i).padStart(2, "0");
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent, text){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
const pad = (s, n) => String(s).padStart(n);
const totals = s => { const real = (s.copper_ms || []).some(c => c > 0); return {real, tot: real ? s.copper_ms : (s.pulse_total_ms || new Array(N).fill(0))}; };

// ---------------------------------------------------------------- state
let S = null;
function render(s){
  S = s;
  state(s);
  if (!s.has_forecast) return;
  const dead = new Set(s.dead || []);
  const working = (s.neurons || []).filter(n => n.activation > 0 && !dead.has(n.id)).length;
  $("obs").innerHTML = fmtMW(s.observed_mw) + "<small>MW</small>";
  $("obsT").textContent = "demand " + hhmm(s.input_hour_boston) + "–" + hhmm(s.forecast_hour_boston);
  $("act").innerHTML = working + "<small>/ " + (N - dead.size) + "</small>";
  $("actT").textContent = "neurons active" + (dead.size ? " · " + dead.size + " dead" : "");
  $("fc").innerHTML = fmtMW(s.forecast_mw) + "<small>MW</small>";
  $("fcT").textContent = "forecast " + hhmm(s.forecast_hour_boston) + "–" + hhmm(plusH(s.forecast_hour_boston, 1));
  const st = (s.sent || {}).status;
  $("copper").textContent = st === "delivered" ? "copper: connected" : "copper: not connected";
  drawCells(s); drawNet(s);
  play(s);
}
function state(s){
  const e = $("state");
  if (!s || !s.has_forecast){ e.className = ""; e.textContent = s && s.error ? "error" : "waiting"; return; }
  const behind = Date.now() - (new Date(s.forecast_hour_boston).getTime() + HOUR);
  const ended = s.alive === 0 || (s.sent && s.sent.status === "terminated");
  e.className = !ended && behind <= 0 ? "live" : "";
  e.textContent = ended ? "terminated" : behind <= 0 ? "live" : behind < 48 * HOUR ? "waiting for data" : "last record";
}

// ---------------------------------------------------------------- 25 cells
function drawCells(s){
  const svg = $("cells"); svg.innerHTML = "";
  const W = 820, cell = W / 5, R = 56, rowH = 152;
  const dead = new Set(s.dead || []), ns = s.neurons || [];
  const {real, tot} = totals(s);
  const k = $("cumKey");
  k.style.background = real ? C.cum : C.cumFill; k.style.border = real ? "none" : "1.5px dashed " + C.cum;
  for (let i = 0; i < N; i++){
    const cx = (i % 5 + .5) * cell, cy = Math.floor(i / 5) * rowH + R + 12;
    const isDead = dead.has(i), ms = isDead ? 0 : (ns[i] || {}).pulse_ms || 0;
    el("circle", {cx, cy, r: R, fill: "none", stroke: isDead ? C.ink : C.ring, "stroke-width": 1.2, id: "ring" + i}, svg);
    if (isDead){
      el("path", {d: `M${cx - 14},${cy - 14} L${cx + 14},${cy + 14} M${cx + 14},${cy - 14} L${cx - 14},${cy + 14}`, stroke: C.ink, "stroke-width": 1.6}, svg);
    } else {
      el("circle", {cx, cy, r: (R * Math.sqrt(ms / 1500)).toFixed(2), fill: C.cuso4, class: "rip", id: "hr" + i}, svg);
      el("circle", {cx, cy, r: (R * Math.sqrt(Math.min(1, (tot[i] || 0) / FULL_MS))).toFixed(2), class: "rip", id: "cu" + i,
                    fill: real ? C.cum : C.cumFill, stroke: real ? "none" : C.cum, "stroke-width": 1, "stroke-dasharray": real ? "" : "3 3"}, svg);
      el("circle", {cx, cy, r: R, fill: "none", stroke: C.cuso4, "stroke-width": 1.5, opacity: 0, class: "rip", id: "rip" + i}, svg);
    }
    el("text", {x: cx - R, y: cy + R + 24, "font-size": 15, fill: isDead ? C.muted : C.ink}, svg, nn(i));
    el("text", {x: cx + R, y: cy + R + 24, "text-anchor": "end", "font-size": 15, fill: ms > 0 ? C.deep : C.muted, id: "ms" + i}, svg,
       isDead ? "—" : ms > 0 ? ms + " ms" : "0");
  }
}
function lit(j, ms){
  const hr = $("hr" + j), rip = $("rip" + j), cu = $("cu" + j), ring = $("ring" + j);
  const {tot} = totals(S);
  const grow = (e, from, dur, ease) => { if (!e) return;
    e.style.transition = "none"; e.style.transform = `scale(${from})`; e.getBoundingClientRect();
    e.style.transition = `transform ${dur}ms ${ease}`; e.style.transform = "scale(1)"; };
  grow(hr, 0, Math.max(ms, 260), "ease-out");
  if (tot[j] > 0) grow(cu, Math.sqrt(Math.max(0, tot[j] - ms) / tot[j]), Math.max(ms, 120), "linear");
  if (rip){
    rip.style.transition = "none"; rip.style.transform = "scale(.4)"; rip.style.opacity = "1"; rip.getBoundingClientRect();
    rip.style.transition = `transform ${Math.max(ms, 260)}ms ease-out, opacity ${Math.max(ms, 260)}ms ease-in`;
    rip.style.transform = "scale(1.16)"; rip.style.opacity = "0";
  }
  if (ring){ ring.setAttribute("stroke", C.cuso4); setTimeout(() => ring.setAttribute("stroke", C.ring), Math.max(ms, 120)); }
  const r = $("nring" + j); if (r){ r.setAttribute("opacity", 1); setTimeout(() => r.setAttribute("opacity", 0), Math.max(ms, 120)); }
}

// ---------------------------------------------------------------- the program's own output
// The lines boston_rpi.py prints each hour (print_result), then the JSON it writes to the
// Arduino Mega for each pulse (ArduinoBridge.pulse) and the Mega's replies.
function lines(s){
  const dead = new Set(s.dead || []), ns = s.neurons || [];
  const total = ns.reduce((a, n) => a + (dead.has(n.id) ? 0 : n.pulse_ms), 0);
  const ts = new Date(s.input_hour_utc);
  const utc = ts.toISOString().replace("T", " ").slice(0, 19) + "+00:00";
  const off = bost(s.input_hour_utc, {timeZoneName: "longOffset"}).split("GMT")[1] || "-05:00";
  const local = ymdB(s.input_hour_boston) + " " + hhmm(s.input_hour_boston) + ":00" + off;
  const L = [];
  const t = (text, cls) => L.push({text, cls});
  t(`[${ymdB(s.updated_utc)} ${hhmm(s.updated_utc)} Boston]`, "dim");
  t("=".repeat(70), "dim");
  t("AGING AI — NEMA / BOSTON", "h");
  t(`Data source         : ${s.source || "ISO-NE"}`);
  t(`Input hour (UTC)    : ${utc}   (${(s.age_hours || 0).toFixed(1)} h old)`);
  t(`Input hour (Boston) : ${local}`);
  t(`NEMA demand now     : ${s.observed_mw.toLocaleString("en-US", {minimumFractionDigits: 1, maximumFractionDigits: 1})} MW`, "h");
  t(`Next-hour forecast  : ${s.forecast_mw.toLocaleString("en-US", {minimumFractionDigits: 1, maximumFractionDigits: 1})} MW`, "p");
  t(`Living neurons      : ${N - dead.size} / ${N}`);
  t(`Pulses this hour    : ${total} ms`);
  t("=".repeat(70), "dim");
  [...ns].sort((a, b) => b.contribution - a.contribution).forEach(n => {
    const d = dead.has(n.id);
    t(`N${nn(n.id)} | ${d ? "DEAD " : "alive"} | contribution=${pad(n.contribution.toFixed(4), 8)} | share=${pad((n.share * 100).toFixed(2) + "%", 6)} | pulse=${pad(n.pulse_ms, 4)} ms`,
      n.pulse_ms > 0 && !d ? "" : "dim");
  });
  const sent = (s.sent || {}).status === "delivered";
  if (!sent) t("# no serial port: the commands below are not sent", "dim");
  t('> {"cmd": "scan"}', "dim");
  if (sent) t(`< {"ok": true, "dead": [${[...dead].join(", ")}]}`, "dim");
  ns.forEach(n => {
    if (n.pulse_ms > 0 && !dead.has(n.id)){
      L.push({text: `> {"cmd": "pulse", "cell": ${n.id}, "ms": ${n.pulse_ms}}`, cls: "p", pulse: [n.id, n.pulse_ms]});
      if (sent) t(`< {"ok": true, "cell": ${n.id}, "delivered_ms": ${n.pulse_ms}}`, "dim");
    }
  });
  t('> {"cmd": "scan"}', "dim");
  if (sent) t(`< {"ok": true, "dead": [${[...dead].join(", ")}]}`, "dim");
  if (sent) t(`Delivered: ${total} ms in total`, "h");
  t(`next hour complete at ${hhmm(plusH(s.forecast_hour_boston, 1))} Boston`, "dim");
  return L;
}
const VIS = 26;
let player = {timer: null, key: ""};
function play(s){
  const key = s.updated_utc + "|" + s.input_hour_utc;
  if (key === player.key && player.timer) return;
  player.key = key; clearTimeout(player.timer);
  const L = lines(s), term = $("term");
  let k = 0;
  const step = () => {
    if (k === 0) term.innerHTML = "";
    const prev = term.lastElementChild; if (prev) prev.classList.remove("cur", "on");
    if (k >= L.length){ k = 0; player.timer = setTimeout(step, 9000); return; }
    const ln = L[k++], d = document.createElement("div");
    d.textContent = ln.text; d.className = (ln.cls || "") + " cur";
    term.appendChild(d);
    while (term.children.length > VIS) term.removeChild(term.firstChild);
    if (ln.pulse){ d.classList.add("on"); lit(ln.pulse[0], ln.pulse[1]); player.timer = setTimeout(step, Math.max(ln.pulse[1], 90)); return; }
    player.timer = setTimeout(step, k <= 11 ? 70 : 55);
  };
  step();
}

// ---------------------------------------------------------------- inputs -> neurons -> forecast
const INPUTS = ["now", "−1h", "−24h", "−1wk", "temp", "hum", "feels", "rain", "h sin", "h cos", "d sin", "d cos", "y sin", "y cos", "wknd"];
function fmtIn(i, v){
  if (v == null) return "";
  if (i < 4) return Math.round(v).toLocaleString("en-US");
  if (i === 5) return Math.round(v) + "%";
  if (i === 14) return v ? "1" : "0";
  if (i === 4 || i === 6) return v.toFixed(1) + "°";
  if (i === 7) return v.toFixed(1);
  return v.toFixed(2);
}
function drawNet(s){
  const svg = $("net"); svg.innerHTML = "";
  const W = 904, cw = (W - 4) / N, x = j => 2 + (j + .5) * cw;
  const yIn = 40, yH = 132, yOut = 184;
  const ns = s.neurons || [], dead = new Set(s.dead || []);
  const act = ns.map(n => dead.has(n.id) ? 0 : n.activation || 0), maxA = Math.max(1e-9, ...act);
  const gap = 24, unit = (W - 2 * gap - 8) / 15, xi = i => 4 + unit * (i + .5) + gap * (i >= 4) + gap * (i >= 8);
  const inputs = s.inputs || [], E = s.edges;
  if (E){
    let maxE = 1e-9;
    for (let i = 0; i < 15; i++) for (let j = 0; j < N; j++) if (act[j] > 0) maxE = Math.max(maxE, Math.abs(E[i][j]));
    for (let j = 0; j < N; j++) if (act[j] > 0) for (let i = 0; i < 15; i++){
      const e = E[i][j], m = Math.abs(e) / maxE;
      if (m < .12) continue;
      el("line", {x1: xi(i), y1: yIn + 5, x2: x(j), y2: yH - 8, stroke: e > 0 ? C.cuso4 : C.neg,
                  "stroke-width": (.5 + 1.6 * m).toFixed(2), "stroke-opacity": (.12 + .6 * m).toFixed(2)}, svg);
    }
  }
  for (let i = 0; i < 15; i++){
    el("circle", {cx: xi(i), cy: yIn, r: 3.6, fill: C.ink}, svg);
    el("text", {x: xi(i), y: 10, "text-anchor": "middle", "font-size": 11, fill: C.mid}, svg, INPUTS[i]);
    if (inputs[i]) el("text", {x: xi(i), y: 25, "text-anchor": "middle", "font-size": 11.5, fill: C.ink}, svg, fmtIn(i, inputs[i].value));
  }
  const push = ns.map(n => dead.has(n.id) ? 0 : (n.push_mw != null ? n.push_mw : n.contribution || 0)), maxP = Math.max(1e-9, ...push.map(Math.abs)), ox = W / 2;
  for (let j = 0; j < N; j++) if (act[j] > 0){
    const m = Math.abs(push[j]) / maxP, up = push[j] >= 0;
    el("line", {x1: x(j), y1: yH + 8, x2: ox, y2: yOut - 7, stroke: up ? C.deep : C.neg, "stroke-width": (.8 + 3 * m).toFixed(2),
                "stroke-opacity": (.35 + .55 * m).toFixed(2), "stroke-dasharray": up ? "" : "3 3"}, svg);
  }
  for (let j = 0; j < N; j++){
    if (dead.has(j)) el("text", {x: x(j), y: yH + 4, "text-anchor": "middle", "font-size": 12, fill: C.ink}, svg, "×");
    else if (act[j] > 0) el("circle", {cx: x(j), cy: yH, r: 3 + 5 * Math.sqrt(act[j] / maxA), fill: C.cuso4}, svg);
    else el("circle", {cx: x(j), cy: yH, r: 3.5, fill: "none", stroke: C.muted, "stroke-width": 1}, svg);
    el("circle", {cx: x(j), cy: yH, r: 12, fill: "none", stroke: C.cuso4, "stroke-width": 1.6, opacity: 0, id: "nring" + j}, svg);
  }
  el("circle", {cx: ox, cy: yOut, r: 6, fill: C.deep}, svg);
  if (s.base_mw != null){
    const sum = s.forecast_mw - s.base_mw;
    el("text", {x: ox + 16, y: yOut + 5, "font-size": 13, fill: C.ink2}, svg,
       `${fmtMW(s.base_mw)} ${sum >= 0 ? "+" : "−"} ${fmtMW(Math.abs(sum))} = ${fmtMW(s.forecast_mw)} MW`);
  }
}

// ---------------------------------------------------------------- since training
function drawRecord(rec){
  if (!rec || !rec.hours || rec.hours.length < 48) return;
  const rows = rec.hours.map(h => ({t: Date.parse(h[0]), o: h[1], f: h[2], live: h[4]}));
  const obs = new Map(rows.map(r => [r.t, r.o])), by = new Map();
  for (const r of rows){ const a = obs.get(r.t + HOUR); if (a == null) continue;
    const k = ymdB(new Date(r.t + HOUR).toISOString()); if (!by.has(k)) by.set(k, []); by.get(k).push({a, f: r.f, t: r.t + HOUR}); }
  const days = [...by.values()].filter(p => p.length >= 20).map(ps => ({t: ps[12].t, a: ps.reduce((s, p) => s + p.a, 0) / ps.length, f: ps.reduce((s, p) => s + p.f, 0) / ps.length}));
  if (days.length < 2) return;
  const firstLive = rows.filter(r => r.live).reduce((m, r) => Math.min(m, r.t), Infinity);
  const svg = $("rec"); svg.innerHTML = "";
  const W = 904, H = 200, L = 44, R = 4, T = 6, B = 24;
  const trained = Date.parse(rec.trained_utc), t0 = Math.min(trained, days[0].t), t1 = Math.max(days[days.length - 1].t, Date.now());
  const vals = days.flatMap(d => [d.a, d.f]), lo0 = Math.min(...vals), hi0 = Math.max(...vals), pd = (hi0 - lo0) * .1;
  const lo = lo0 - pd, hi = hi0 + pd;
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  if (isFinite(firstLive)) el("rect", {x: L, y: T, width: Math.max(0, x(firstLive) - L), height: H - T - B, fill: C.replay}, svg);
  for (const v of [2000, 2500, 3000, 3500]) if (v > lo && v < hi){
    el("line", {x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: C.faint}, svg);
    el("text", {x: L - 6, y: y(v) + 4, "text-anchor": "end", "font-size": 11, fill: C.mid}, svg, fmtMW(v));
  }
  for (let t = t0; t <= t1; t += DAY){
    const d = Number(bost(new Date(t).toISOString(), {day: "numeric"}));
    if (d === 1) el("text", {x: x(t), y: H - 6, "text-anchor": "middle", "font-size": 11, fill: C.mid}, svg, bost(new Date(t).toISOString(), {month: "2-digit"}) + "-01");
  }
  el("line", {x1: L, x2: W - R, y1: H - B, y2: H - B, stroke: C.rule}, svg);
  el("path", {d: "M" + days.map(p => x(p.t).toFixed(1) + "," + y(p.a).toFixed(1)).join(" L"), fill: "none", stroke: C.ink, "stroke-width": 1.4}, svg);
  el("path", {d: "M" + days.map(p => x(p.t).toFixed(1) + "," + y(p.f).toFixed(1)).join(" L"), fill: "none", stroke: C.deep, "stroke-width": 1.4, "stroke-dasharray": "4 3"}, svg);
  const pairs = [...by.values()].flat(), tEnd = Math.max(...pairs.map(p => p.t));
  const mae = ps => ps.length ? Math.round(ps.reduce((s, p) => s + Math.abs(p.f - p.a), 0) / ps.length) : 0;
  $("rec").dataset.note = `daily mean · error ${mae(pairs.filter(p => p.t < trained + 7 * DAY))} → ${mae(pairs.filter(p => p.t > tEnd - 7 * DAY))} MW/h · shaded: replayed`;
  $("rec").dataset.ready = "1";
}

// ---------------------------------------------------------------- screen
function fit(){
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  $("stage").style.transform = `translate(${(innerWidth - 1920 * k) / 2}px, ${(innerHeight - 1080 * k) / 2}px) scale(${k})`;
}
addEventListener("resize", fit); fit();
setInterval(() => { $("clock").textContent = "Boston " + bost(new Date().toISOString(), {hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"}); if (S) state(S); }, 1000);
let pi = -1;
function rotate(){
  const ps = [$("net"), $("rec")].filter(p => p.id !== "rec" || p.dataset.ready);
  pi = (pi + 1) % ps.length;
  [$("net"), $("rec")].forEach(p => p.classList.remove("show"));
  ps[pi].classList.add("show");
  $("panelTitle").textContent = ps[pi].dataset.title;
  $("panelNote").textContent = ps[pi].id === "rec" ? ps[pi].dataset.note : "blue: up · grey: down";
}
async function loadRecord(){ try { const r = await fetch("record.json?t=" + Date.now(), {cache: "no-store"}); if (r.ok) drawRecord(await r.json()); } catch (e) {} }
async function tick(){
  try {
    let r = await fetch("status.json?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) r = await fetch("/api/status", {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    const s = await r.json();
    if (!S || s.updated_utc !== S.updated_utc || s.input_hour_utc !== S.input_hour_utc) render(s);
  } catch (e) { $("state").className = ""; $("state").textContent = "offline"; }
}
tick(); loadRecord();
setTimeout(rotate, 300);
setInterval(rotate, 20000);
setInterval(tick, 60000);
setInterval(loadRecord, 600000);
</script>
</body>
