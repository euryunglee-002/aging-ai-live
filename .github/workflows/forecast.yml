name: Hourly forecast

on:
  schedule:
    - cron: "17 * * * *"        # every hour, 17 minutes past (UTC)
  workflow_dispatch:            # "Run workflow" button
  push:                         # also run once whenever the forecasting code changes
    branches: [main]
    paths:
      - "cloud_forecast.py"
      - "boston_rpi.py"
      - "aging_ai_boston.py"
      - "aging_ai_boston_model.npz"
      - ".github/workflows/forecast.yml"

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install numpy pandas requests

      - name: Forecast
        env:
          ISO_NE_USER: ${{ secrets.ISO_NE_USER }}
          ISO_NE_PASSWORD: ${{ secrets.ISO_NE_PASSWORD }}
        run: python cloud_forecast.py

      - name: Publish
        run: |
          git config user.name "aging-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q || true
          git push
